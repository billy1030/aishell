[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aishell"
version = "0.1.1"
description = "Terminal AI Shell - Interactive, system-aware Linux AI console assistant and REPL"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "aishell team" }
]
dependencies = [
    "typer>=0.16.0",
    "rich>=14.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.16.0",
    "distro>=1.9.0",
    "psutil>=7.0.0",
    "prompt-toolkit>=3.0.50,<4.0.0",
    "pygments>=2.19.0,<3.0.0",
    "openai>=3.50.0,<4.0.0",
    "google-genai>=3.3.0,<4.0.0",
    "anthropic>=2.8.0,<3.0.0",
    "httpx>=0.28.0,<1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
aishell = "aishell.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/aishell"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

